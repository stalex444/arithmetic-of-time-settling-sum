fidelity:
  divergences: >-
    (a) The plastic number enters hypothesis-style: statements 1-4 hold for
    every real rho with rho^3 = rho + 1, and statement 7 proves there is
    exactly one; no named constant appears in a compared statement (the
    library defines one, PisotSum.plastic, not compared). (b) Statements
    5-6 assume neither theta > 1 nor irreducibility nor that a, b, c come
    from a Pisot number: the hypotheses are a real theta, a complex alpha
    with ||alpha|| < 1 and the three Vieta equations theta + alpha + conj
    alpha = a, theta (alpha + conj alpha) + alpha conj alpha = b, theta
    alpha conj alpha = c with a, b, c integers. (c) Statement 6 takes an
    explicit N with ||alpha||^N < 1/4 as a hypothesis rather than asserting
    that such an N exists; for rho the smallest such N is 10 (rho^(-5) < 1/4, i.e.
    2 rho^(-5) < 1/2; the n = 10 correction term is zero).
    (d) Statement 3's conjugate is specified as any complex alpha with
    alpha^3 = alpha + 1 and alpha != rho; the two conjugates give the same
    series, which is symmetric in alpha and conj alpha. (e) Sums over n >= 1
    are indexed over the natural numbers as fun n => (.)^(n + 1), and the
    sum in statement 3 starts at n = 0 (the n = 0 term is 2). (f) ||.|| is
    distInt x = |x - round x| with Mathlib's round, which rounds half-integers
    up. This convention never enters: in statements 5-6 theta is a root of
    the monic integer cubic x^3 - a x^2 + b x - c, so every theta^n is an
    algebraic integer and no algebraic integer is a half-integer; for rho,
    every rho^n with n >= 1 is irrational (its conjugates z^n, conj(z)^n
    have modulus rho^(-n/2) != rho^n). (g) The physical reading in the README's application
    section is cited, not a theorem; no compared statement asserts it.

