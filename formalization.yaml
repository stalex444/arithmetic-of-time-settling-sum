      predicate, no Perrin sequence and no distance-to-nearest-integer
      function, which is why distInt and perrin are defined here.

status:
  scope: >-
    Formalized: seven compared theorems, in comparator order, namespace
    SettlingSum (see the description for their content). Proved in the
    repository, not compared: the trace identity P(n) = rho^n + z^n + conj
    z^n for the explicit conjugate z = (-rho + i sqrt(3 rho^2 - 4))/2, the
    bound |t_n| < 1/2 for n >= 10, the value 2 rho^2 + 3 rho - 2 of the
    three geometric series, the finite correction 2 - 2 rho - 2 rho^2, a
    named constant PisotSum.plastic (Classical.choose of statement 7) with
    the headline restated for it, and the general-cubic lemmas (the trace
    defect as alpha^n + conj alpha^n, its bound 2 ||alpha||^n, and the
    reality of geo). Not formalized: Pisot's theorem (convergence iff Pisot,
    in every degree) and the divergence for the non-Pisot Q; the census of
    S(theta) over 109 Pisot units of degree 2-4 (computed, not in the
    package); whether S(theta) = theta characterizes rho among Pisot
    numbers (open); any principle behind the one remaining equality of the
    mechanism (the six rounding events refund 2 rho^4 - 2), which is proved
    as a finite computation.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

