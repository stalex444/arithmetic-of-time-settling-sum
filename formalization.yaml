      lean: "SettlingSum.plastic_settling_sum"
      module: "Solution"
      status: "proved"
      note: "sum_{n >= 1} ||rho^n||^2 = rho, as a HasSum, for every real rho with rho^3 = rho + 1."
    - source: "This work; routine from statement 1"
      lean: "SettlingSum.plastic_tsum"
      module: "Solution"
      status: "proved"
      note: "The tsum form of statement 1."
    - source: "This work, 2026-11-03"
      lean: "SettlingSum.plastic_even_trace"
      module: "Solution"
      status: "proved"
      note: "sum_{n >= 0} (alpha^(2n) + conj(alpha)^(2n)) = rho for every complex root alpha != rho of x^3 - x - 1."
    - source: "OEIS A001608, comment of R. Stephan (2002); proved here and shown sharp"
      lean: "SettlingSum.perrin_round_threshold"
      module: "Solution"
      status: "proved"
      note: "round(rho^n) = P(n) for every n >= 10, and round(rho^9) != P(9)."
    - source: "This work"
      lean: "SettlingSum.cubic_trace_sum"
      module: "Solution"
      status: "proved"
      note: "sum_{n >= 1} (S_n - theta^n)^2 = Re(geo alpha) for a real theta with a complex conjugate pair alpha, conj alpha inside the unit disc."
    - source: "This work"
      lean: "SettlingSum.cubic_settling_sum"
      module: "Solution"
      status: "proved"
      note: "sum_{n >= 1} ||theta^n||^2 = Re(geo alpha) + the finite rounding correction up to any N with ||alpha||^N < 1/4."
    - source: "Elementary"
      lean: "SettlingSum.existsUnique_root"
      module: "Solution"
      status: "proved"
      note: "x^3 = x + 1 has exactly one real solution."

