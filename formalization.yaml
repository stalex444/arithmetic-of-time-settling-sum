# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# A new entry, a companion of the registered entry PALOMAR-2026-08-19-000006
# (stalex444/arithmetic-of-time); not a revision of it.
version: "v0.4"

project:
  name: "The settling sum of the plastic number: sum_{n >= 1} ||rho^n||^2 = rho. The squared distances from the powers of the plastic number to the nearest integers sum to the plastic number itself; the even-power trace of its two hidden conjugates is rho; with the general cubic complex-pair form"
  description: >-
    Kernel-checked proofs, in Lean 4 + Mathlib, of seven statements. Write
    ||x|| = |x - round x| for the distance from a real number to the nearest
    integer, and let rho be the plastic number, the real root of x^3 = x + 1
    and the smallest Pisot number (Siegel 1944). Convergence of
    sum_{n >= 1} ||theta^n||^2 for a Pisot number theta is elementary, and Pisot
    (1938) proved the converse; neither gives the value. (1) For every real rho with rho^3 = rho + 1,
    sum_{n >= 1} ||rho^n||^2 = rho (as a HasSum). (2) The tsum form of (1).
    (3) For every complex alpha != rho with alpha^3 = alpha + 1 (one of the
    two conjugates inside the unit disc), sum_{n >= 0} (alpha^(2n) +
    conj(alpha)^(2n)) = rho: the even-power trace of the hidden pair is the
    generator, the mechanism behind (1), because x^3 - x - 1 =
    (x - 1) x (x + 1) - 1 makes the resolvent trace sum_{roots} 1/(1 - r^2)
    vanish. (4) For every n >= 10 the nearest integer to rho^n is the
    Perrin number P(n), and for n = 9 it is not (P(9) = 12, rho^9 = 12.56...):
    the threshold recorded in OEIS A001608 (R. Stephan, 2002), proved and
    shown sharp. (5) For a real theta, a complex alpha with ||alpha|| < 1,
    and integers a, b, c that are the elementary symmetric functions of
    (theta, alpha, conj alpha): sum_{n >= 1} (S_n - theta^n)^2 = Re(geo alpha),
    where S_n are the Newton power sums of x^3 - a x^2 + b x - c and
    geo alpha = alpha^2/(1 - alpha^2) + conj(alpha)^2/(1 - conj(alpha)^2) +
    2 alpha conj(alpha)/(1 - alpha conj(alpha)). (6) Under the same
    hypotheses, for every N with ||alpha||^N < 1/4, sum_{n >= 1}
    ||theta^n||^2 = Re(geo alpha) + sum_{n = 1}^{N} (||theta^n||^2 -
    (S_n - theta^n)^2): Pisot's convergence in quantitative form for the
    cubic complex-pair case; (1) is the case a = 0, b = -1, c = 1, N = 10 (the smallest N
    with rho^(-N/2) < 1/4; the n = 10 correction term is zero),
    with Re(geo alpha) = 2 rho^2 + 3 rho - 2 and correction
    2 - 2 rho - 2 rho^2. (7) x^3 = x + 1 has exactly one real solution.
    Statements 5-6 assume neither theta > 1 nor irreducibility. Pisot's
    theorem itself is not formalized. Application to time (no compared
    statement asserts it): in the arithmetic of time the tick is
    multiplication by rho on Q(rho) and the record is the integer lattice;
    statement 1 says the total squared distance by which the tick history
    falls short of its record is exactly one tick's unit, rho, and statement
    3 says that unit is returned by the two conjugates that are not seen;
    the quartic companion Q, Q^4 = Q + 1, is not Pisot, so by Pisot's theorem
    its series diverges (not proved here). That physical time is this
    arithmetic is the identification stated in the companion entry
    PALOMAR-2026-08-19-000006 (the arithmetic of time), as an identification;
    the theorems here are its arithmetic content. That entry's README Scope
    section is reproduced verbatim in this entry's README.
  authors:
    - "Stephanie Alexander"
  license: "MIT"
  responsible_maintainers:
    - "Stephanie Alexander"

classification:
  # math.NT / 11R06 (Pisot numbers), 11J71 (distribution modulo one: the
  # distance ||rho^n|| to the nearest integer), 11B39 (the Perrin sequence
  # and its recurrence; statement 4). math-ph and physics.hist-ph / 00A79
  # because the README's application section and the Challenge docstring
  # state the physical reading as a cited application of the companion
  # entry PALOMAR-2026-08-19-000006, which identifies physical time with
  # this arithmetic and states that as an identification, not as a theorem;
  # the README reproduces that entry's Scope section verbatim. No compared
  # statement is a physical claim.
  arxiv: ["math.NT", "math-ph", "physics.hist-ph"]
  msc2020: ["11R06", "11J71", "11B39", "00A79"]

sources:
  - title: "The settling sum of the plastic number (the seven compared statements)"
    authors:
      - "Stephanie Alexander"
    type: "original-proof"
    location: "README.md, sections 'The compared statements', 'The proof in five lines' and 'Relation to the literature'"
    relationship: "other"
    author_endorsement: "participated"
    note: >-
      ORIGIN DECLARATION (relationship "other" because the schema has no
      value for a result presented together with its formalization, with no
      prior statement found in the recorded search).
      Statements 1-6 were stated and proved for this entry: the identity
      sum ||rho^n||^2 = rho was found and checked exactly in Q(rho) on
      2026-11-02, the mechanism (statement 3, the vanishing resolvent trace)
      on 2026-11-03; the exact Q(rho) computation and the census over 109
      Pisot units of degree 2-4 are in the author's working notes. No prior
      statement was found in the recorded search (README, 'Relation to the
      literature'). Statement 7 is routine. The three geometric series and
      the trace identity are classical and no novelty is claimed for them.
    license: "MIT"
  - title: "La répartition modulo 1 et les nombres algébriques"
    authors:
      - "Charles Pisot"
    id: "Annali della Scuola Normale Superiore di Pisa, Classe di Scienze, 2e série, 7 (1938), no. 3-4, 205-248"
    # No DOI (Numdam item ASNSP_1938_2_7_3-4_205_0, Zbl 0019.15502); the
    # Numdam landing page was checked for the bibliographic data on
    # 2026-11-03. The paper itself was not read; cited via the reference
    # list of the CRC Concise Encyclopedia entry on Pisot-Vijayaraghavan
    # constants.
    type: "article"
    location: "https://www.numdam.org/item/ASNSP_1938_2_7_3-4_205_0/"
    relationship: "background"
    note: >-
      Pisot's theorem: for real theta > 1, sum ||lambda theta^n||^2 < infinity
      for some real lambda != 0 iff theta is a Pisot number (and then lambda
      is in Q(theta)). Gives the convergence of the series in statement 1
      (lambda = 1) and the divergence for the non-Pisot Q cited in the
      application paragraph; says nothing about the value. Not formalized
      here.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Algebraic integers whose conjugates lie in the unit circle"
    authors:
      - "Carl Ludwig Siegel"
    id: "Duke Mathematical Journal 11 (1944), 597-602"
    # Crossref-verified 2026-11-03: DOI 10.1215/S0012-7094-44-01152-X.
    # Original not read; cited via the CRC reference list.
    type: "article"
    location: "https://doi.org/10.1215/S0012-7094-44-01152-X"
    relationship: "background"
    note: "The plastic number rho is the smallest Pisot number. Background; not used in any proof."
    license: "unknown"
    author_endorsement: "n/a"
  - title: "A remarkable class of algebraic integers. Proof of a conjecture of Vijayaraghavan"
    authors:
      - "Raphaël Salem"
    id: "Duke Mathematical Journal 11 (1944), 103-108"
    # Crossref-verified 2026-11-03: DOI 10.1215/S0012-7094-44-01111-7.
    # Original not read; cited via the CRC reference list.
    type: "article"
    location: "https://doi.org/10.1215/S0012-7094-44-01111-7"
    relationship: "background"
    note: >-
      Salem's lemma: for a Pisot number theta there is a lambda in [1, theta)
      with sum_{n >= 0} sin^2(pi lambda theta^n) <= pi^2 (2 theta + 1)^2 /
      (theta - 1)^2. An upper bound on the series, not an evaluation;
      statement 1 is the exact value at lambda = 1, theta = rho.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "OEIS A001608, Perrin sequence (comment of Ralf Stephan, Dec 13 2002: 'If n>9 then a(n)=round(r^n)')"
    authors:
      - "The OEIS Foundation (sequence); Ralf Stephan (comment)"
    id: "OEIS A001608"
    # Page opened 2026-11-02; the comment is quoted from it.
    type: "web post"
    location: "https://oeis.org/A001608"
    relationship: "background"
    note: >-
      The threshold from which the Perrin numbers are the nearest integers to
      rho^n. Statement 4 proves the comment (n >= 10) and shows it sharp
      (n = 9 fails). The page states no sum and no exception list.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "OEIS A084252, round(1/(r^n - round(r^n))) for the plastic number r"
    authors:
      - "The OEIS Foundation (sequence); Henry Bottomley (2003)"
    id: "OEIS A084252"
    # Page opened 2026-11-02.
    type: "web post"
    location: "https://oeis.org/A084252"
    relationship: "background"
    note: >-
      The nearest prior tabulation of ||rho^n|| found: the signed reciprocal
      distance of rho^n to the nearest integer, n = 1..63. No sum and no
      closed form.
    license: "unknown"
    author_endorsement: "not-contacted"

